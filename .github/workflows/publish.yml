name: Auto publish
on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          runtime: "bun@1.4"
          install: false

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check for new version and commit it to metafile
        run: echo "VERSION=$(bun src/bump.ts)" >> $GITHUB_ENV
      - name: Publish to npm
        run: |
          if [ -z "${{ env.VERSION }}" ]; then
            echo "No valid Vale release found; skipping npm publish."
          else
            git config --local user.name "Github Action"
            git config --local user.email "action@github.com"
            git add meta.json
            git commit -am "Bump: ${{ env.VERSION }}"
            pnpm publish --access public --provenance --no-git-checks
          fi

